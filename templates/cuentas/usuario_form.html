{% extends "base.html" %}

{% block title %}Gestión de usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h5 mb-3">
          {% if object %}Editar usuario{% else %}Nuevo usuario{% endif %}
        </h1>

        <form method="post">
          {% csrf_token %}
          {{ form.non_field_errors }}

          {% for field in form %}
            <div class="mb-3">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {{ field.errors }}
            </div>
          {% endfor %}

          <button class="btn btn-primary w-100" type="submit">
            Guardar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
