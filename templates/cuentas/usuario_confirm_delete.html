{% extends "base.html" %}

{% block title %}Eliminar usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body">
        <h1 class="h5 text-danger">Confirmar eliminación</h1>
        <p>¿Seguro que deseas eliminar al usuario <strong>{{ object.username }}</strong>?</p>

        <form method="post">
          {% csrf_token %}
          <a href="{% url 'usuarios_list' %}" class="btn btn-secondary">
            Cancelar
          </a>
          <button type="submit" class="btn btn-danger">
            Sí, eliminar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
