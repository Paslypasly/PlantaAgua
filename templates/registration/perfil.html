{% extends "base.html" %}

{% block title %}Mi perfil{% endblock %}

{% block content %}
<div class="container py-5">
  <h1 class="h4 mb-4">Mi perfil</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}

    <button class="btn btn-primary">Guardar cambios</button>
    <a href="{% url 'password_change' %}" class="btn btn-outline-secondary ms-2">
      Cambiar contraseña
    </a>
  </form>
</div>
{% endblock %}
